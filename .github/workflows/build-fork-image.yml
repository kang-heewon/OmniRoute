name: Build fork image

on:
  push:
    branches:
      - feat/gpt6-sol-image

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omniroute:3.8.51-web-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_WORKERS=1
            OMNIROUTE_BUILD_MEMORY_MB=5632
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/omniroute
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:3.8.51-web-$SHA" \
            "$IMAGE:3.8.51-web-$SHA-amd64" \
            "$IMAGE:3.8.51-web-$SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:3.8.51-web-$SHA"
